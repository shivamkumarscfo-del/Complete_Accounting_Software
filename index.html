<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shivara CFO — Billing &amp; Accounting</title>
<meta name="theme-color" content="#0f2740">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0f2740;overflow:hidden;
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#dfe8f5;gap:14px;z-index:2;transition:opacity .4s}
  #load.hide{opacity:0;pointer-events:none}
  .brand{font-size:20px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:12.5px;opacity:.75}
  .bar{width:180px;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#7fb3ff;border-radius:3px;animation:go 1.1s infinite}
  @keyframes go{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
  <div id="load">
    <img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:16px">
<div class="brand">Shivara CFO Services</div>
    <div class="bar"><i></i></div>
    <div class="sub">Loading your workspace…</div>
  </div>
  <iframe id="app" title="Shivara CFO" allow="clipboard-write; camera; microphone"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
/* ------------------------------------------------------------------
   PUT YOUR DEPLOYED WEB APP ADDRESS HERE (the .../exec one), once.
   Everything else works by itself: query parameters such as the
   customer-portal link (?portal=...&c=...) are passed straight through.
------------------------------------------------------------------- */
/* =====  EDIT ONLY THIS ONE LINE  =====================================
   Paste your deployed web-app address between the quotes.
   You get it from: Apps Script -> Deploy -> Manage deployments -> copy the
   Web app URL (it ends with /exec).
   ==================================================================== */
var APP_EXEC_URL = "https://script.google.com/macros/s/AKfycbznbMW9WUCIvkcW8e-NkiC0AUZYh8cRbWeimgtXxF_OvkVK8R0ywxOuWLMOaAFc2qtE/exec";

(function(){
  var qs = window.location.search || '';
  var src = APP_EXEC_URL + qs;
  var f = document.getElementById('app');
  if (APP_EXEC_URL.indexOf('script.google.com') < 0){
    document.getElementById('load').innerHTML =
      '<div class="brand">One step left</div>' +
      '<div class="sub">Open index.html and paste your web-app address into APP_EXEC_URL.</div>';
    return;
  }
  f.addEventListener('load', function(){
    var l = document.getElementById('load');
    if (l) l.classList.add('hide');
  });
  f.src = src;
  // keep the address bar clean on mobile
  if (window.history && window.history.replaceState && qs.indexOf('portal=') < 0)
    window.history.replaceState({}, '', window.location.pathname);
})();
</script>
</body>
</html>
